<!doctype html>
<!-- Home-mail web app (add to home screen). Contains no data: login via Home Assistant, mail over the websocket. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home-mail">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Home-mail</title>
<style>
  html, body { margin:0; height:100%; background:#f2f2f7; overscroll-behavior:none; }
  #status { position:fixed; top:env(safe-area-inset-top); left:0; right:0; z-index:30; text-align:center; font:13px -apple-system,system-ui,sans-serif; background:#ff9f0a; color:#fff; padding:4px; }
  #push { position:fixed; left:12px; right:12px; bottom:max(16px, env(safe-area-inset-bottom)); z-index:30; display:flex; align-items:center; gap:10px;
    background:#1c1c1e; color:#fff; border-radius:14px; padding:12px 14px; font:15px -apple-system,system-ui,sans-serif; box-shadow:0 6px 24px rgba(0,0,0,.3); }
  #push span { flex:1; }
  #push button { border:0; border-radius:10px; background:#0a84ff; color:#fff; font:600 15px -apple-system,system-ui,sans-serif; padding:8px 12px; }
  #push button.x { background:transparent; padding:8px; }
  /* login and "turn on notifications" screens */
  #hm-screen { position:fixed; inset:0; z-index:40; overflow:auto; background:#f2f2f7; color:#1c1c1e; font:17px -apple-system,"SF Pro Text",system-ui,Roboto,sans-serif;
    padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 20px); box-sizing:border-box; }
  .hm-c { max-width:400px; min-height:100%; margin:0 auto; display:flex; flex-direction:column; align-items:center; }
  .hm-icon { width:96px; height:96px; border-radius:22px; box-shadow:0 8px 24px rgba(10,132,255,.25); margin-top:24px; }
  .hm-word { font-weight:700; font-size:34px; letter-spacing:-1px; margin-top:16px; text-align:center; }
  .hm-word b { background:linear-gradient(#20c997,#0a84ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hm-title { font-size:28px; }
  .hm-sub { color:#8e8e93; font-size:15px; margin-top:6px; text-align:center; line-height:1.35; }
  .hm-sub b { color:#1c1c1e; }
  .hm-card, .hm-list { width:100%; background:#fff; border-radius:14px; margin-top:28px; overflow:hidden; }
  .hm-card label { display:block; padding:10px 16px; font-size:12px; color:#8e8e93; border-bottom:1px solid #e5e5ea; }
  .hm-card label:last-child { border:0; }
  .hm-card input { display:block; width:100%; border:0; outline:0; background:transparent; color:inherit; font:inherit; padding:3px 0 0; }
  .hm-row { width:100%; display:flex; justify-content:space-between; align-items:center; padding:14px 4px 0; font-size:15px; color:#3a3a3c; }
  .hm-row input { appearance:none; -webkit-appearance:none; width:51px; height:31px; border-radius:16px; background:#e9e9eb; position:relative; margin:0; transition:background .2s; }
  .hm-row input::after { content:""; position:absolute; left:2px; top:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:left .2s; }
  .hm-row input:checked { background:#34c759; }
  .hm-row input:checked::after { left:22px; }
  .hm-code { width:100%; margin-top:28px; text-align:center; font-size:30px; letter-spacing:10px; border:0; border-radius:14px; padding:14px; outline:2px solid #0a84ff; }
  .hm-err { color:#ff3b30; font-size:14px; min-height:20px; margin-top:12px; text-align:center; }
  .hm-btn { width:100%; margin-top:8px; border:0; background:#0a84ff; color:#fff; font:600 17px -apple-system,system-ui,sans-serif; padding:15px; border-radius:14px; }
  .hm-btn:disabled { opacity:.6; }
  .hm-link { background:transparent; color:#0a84ff; font-weight:500; font-size:15px; }
  .hm-foot { margin-top:auto; padding-top:28px; text-align:center; color:#8e8e93; font-size:13px; line-height:1.6; }
  .hm-made { color:#8e8e93; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
  .hm-bell { width:96px; height:96px; border-radius:22px; background:linear-gradient(#ff5e57,#ff3b30); box-shadow:0 8px 24px rgba(255,59,48,.25);
    display:flex; align-items:center; justify-content:center; margin-top:40px; }
  .hm-list { padding:4px 16px; box-sizing:border-box; }
  .hm-list div { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid #e5e5ea; font-size:15px; }
  .hm-list div:last-child { border:0; }
  .hm-list span { width:28px; height:28px; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; }
  @media (prefers-color-scheme: dark) {
    #hm-screen { background:#000; color:#fff; }
    .hm-card, .hm-list, .hm-code { background:#1c1c1e; color:#fff; }
    .hm-card label, .hm-list div { border-color:#38383a; }
    .hm-sub b { color:#fff; }
    .hm-row { color:#d1d1d6; }
  }
  @media (prefers-color-scheme: dark) {
    html, body { background:#000; }
    homemail-app { --primary-background-color:#000; --card-background-color:#1c1c1e; --secondary-background-color:#2c2c2e; --primary-text-color:#fff; --secondary-text-color:#8e8e93; --divider-color:#38383a; }
  }
</style>
</head>
<body>
<div id="status" hidden></div>
<homemail-app standalone></homemail-app>
<script type="module">
  document.documentElement.lang = (navigator.language || "en").slice(0, 2);
  import(`./web.js?v=${Date.now()}`).catch(() => {
    const s = document.getElementById("status");
    s.hidden = false;
    s.textContent = "Loading failed. Check the connection and try again.";
  });
</script>
</body>
</html>
