name: Release

on:
  push:
    branches: [main]
    paths: [custom_components/homemail/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a GitHub release when the manifest version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version custom_components/homemail/manifest.json)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists"
          else
            gh release create "$version" --target "$GITHUB_SHA" --title "Home-mail ${version#v}" --notes-file RELEASE_NOTES.md
          fi
